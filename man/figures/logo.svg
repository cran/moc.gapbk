<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 278" width="240" height="278">
  <!-- Hex sticker shape -->
  <defs>
    <clipPath id="hex">
      <polygon points="120,8 232,72 232,206 120,270 8,206 8,72"/>
    </clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E74B5"/>
      <stop offset="100%" stop-color="#1F4E79"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <polygon points="120,8 232,72 232,206 120,270 8,206 8,72"
           fill="url(#bg)" stroke="#0F2E4A" stroke-width="3"/>

  <!-- Pareto front curve -->
  <g clip-path="url(#hex)" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.9">
    <path d="M 50,200 Q 80,150 120,130 Q 160,110 190,80" />
  </g>

  <!-- Clusters of points (3 clusters representing multi-objective solutions) -->
  <g clip-path="url(#hex)">
    <!-- Cluster 1 - top right -->
    <circle cx="175" cy="95"  r="6" fill="#FFC000"/>
    <circle cx="185" cy="105" r="5" fill="#FFC000"/>
    <circle cx="165" cy="100" r="5" fill="#FFC000"/>

    <!-- Cluster 2 - center -->
    <circle cx="115" cy="135" r="6" fill="#70AD47"/>
    <circle cx="125" cy="125" r="5" fill="#70AD47"/>
    <circle cx="105" cy="145" r="5" fill="#70AD47"/>

    <!-- Cluster 3 - bottom left -->
    <circle cx="65" cy="195" r="6" fill="#ED7D31"/>
    <circle cx="55" cy="185" r="5" fill="#ED7D31"/>
    <circle cx="75" cy="205" r="5" fill="#ED7D31"/>
  </g>

  <!-- Package name -->
  <text x="120" y="240"
        font-family="Helvetica, Arial, sans-serif"
        font-size="26" font-weight="bold"
        text-anchor="middle" fill="#FFFFFF">moc.gapbk</text>
</svg>
